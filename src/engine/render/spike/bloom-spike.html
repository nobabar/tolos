<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bloom craft spike (9.1)</title>
    <style>
      html {
        background: #141210;
        color: #e8e4dc;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      body {
        margin: 0;
        padding: 1.25rem;
      }
      h1 {
        font-size: 1.1rem;
        font-weight: 600;
        margin: 0 0 0.75rem;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        align-items: flex-start;
      }
      canvas {
        display: block;
        width: min(960px, 100%);
        height: auto;
        background: #000;
      }
      label {
        display: grid;
        gap: 0.25rem;
        font-size: 0.85rem;
        min-width: 10rem;
      }
      .dials {
        display: grid;
        gap: 0.75rem;
      }
      .presets {
        display: flex;
        gap: 0.5rem;
      }
      button {
        background: #2a2622;
        color: #e8e4dc;
        border: 1px solid #4a453e;
        padding: 0.35rem 0.7rem;
        cursor: pointer;
      }
      #status {
        margin-top: 0.75rem;
        font-size: 0.8rem;
        opacity: 0.85;
      }
      .note {
        margin-top: 1rem;
        max-width: 40rem;
        font-size: 0.8rem;
        line-height: 1.45;
        opacity: 0.8;
      }
      code {
        font-size: 0.78rem;
      }
    </style>
  </head>
  <body>
    <h1>Bloom craft spike (isolated, not product family)</h1>
    <div class="row">
      <canvas id="stage" width="960" height="540"></canvas>
      <div class="dials">
        <label>
          Fixed seed
          <select id="seed"></select>
        </label>
        <label>
          Softness <span id="softness-out">0.45</span>
          <input id="softness" type="range" min="0" max="1" step="0.01" />
        </label>
        <label>
          Grain <span id="grain-out">0.35</span>
          <input id="grain" type="range" min="0" max="1" step="0.01" />
        </label>
        <label>
          Energy <span id="energy-out">0.55</span>
          <input id="energy" type="range" min="0" max="1" step="0.01" />
        </label>
        <div class="presets">
          <button id="calm" type="button">Calm (high soft / low energy)</button>
          <button id="structure" type="button">Structure (low soft / high energy)</button>
        </div>
      </div>
    </div>
    <p id="status">loading</p>
    <p class="note">
      Fixed seeds for go/no-go:
      <code>bloom-petal-01</code>,
      <code>bloom-cloud-02</code>,
      <code>bloom-macro-03</code>.
      Dev URL:
      <code>/src/engine/render/spike/bloom-spike.html</code>.
      Softness should calm the field; Energy should raise warp / structure.
    </p>
    <script type="module" src="./bloom-spike-host.ts"></script>
  </body>
</html>
